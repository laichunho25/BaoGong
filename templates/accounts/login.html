{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "登录" %} - QS Matching{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{% translate "登录" %}</h1>

  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {% include "accounts/_form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit"
            class="w-full rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-700">
      {% translate "登录" %}
    </button>
  </form>

  <p class="mt-4 text-sm text-slate-600">
    {% translate "还没有账号？" %}
    <a href="{% url 'accounts:register' %}" class="font-medium text-slate-900 underline">{% translate "注册" %}</a>
  </p>
</div>
{% endblock %}

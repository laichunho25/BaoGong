name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  DATABASE_URL: postgres://baogong:baogong@localhost:5432/baogong_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy apps/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: baogong
          POSTGRES_PASSWORD: baogong
          POSTGRES_DB: baogong_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U baogong" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group dev
      - name: missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      # `.mo` files are build output and are not committed, so the catalogue is
      # compiled here too - otherwise the suite would assert against English
      # msgids that production never shows.
      - name: compile messages
        run: |
          sudo apt-get update && sudo apt-get install -y gettext
          uv run django-admin compilemessages --locale zh_Hans
      - name: pytest
        run: uv run pytest -m "not eval"

# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Region: Singapore. Render has no Hong Kong region; Singapore is the closest
# option and satisfies COMPLIANCE section 5 (servers in HK or overseas, never
# mainland China). All four services must share a region so they can talk over
# the private network instead of the public internet.
#
# Secrets marked `sync: false` are NOT stored in this file. Set them once in the
# Render dashboard (CLAUDE.md rule 8: secrets come from the environment only).

previewsEnabled: false

databases:
  - name: baogong-postgres
    databaseName: baogong
    user: baogong
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  # ------------------------------------------------------------------ web
  - type: web
    name: baogong-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    # www is canonical; Render serves the apex too and redirects it to the
    # first domain listed. Canonical <link> tags are built from the request
    # host (see templates), so two hosts answering 200 would publish two
    # canonicals for every page - the redirect is what keeps that from
    # happening. Both must also appear in ALLOWED_HOSTS below.
    domains:
      - www.baogong.com.hk
      - baogong.com.hk
    # Render sets $PORT; gunicorn must bind it, not the Dockerfile's 8000.
    dockerCommand: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: baogong-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: baogong-keyvalue
          type: keyvalue
          property: connectionString
      - fromGroup: baogong-shared

  # ------------------------------------------------------------------ worker
  - type: worker
    name: baogong-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    dockerCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: baogong-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: baogong-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: baogong-keyvalue
          type: keyvalue
          property: connectionString
      # A worker has no external hostname; ALLOWED_HOSTS still has to be
      # non-empty for prod.py to import.
      - key: ALLOWED_HOSTS
        value: baogong-worker.internal
      - fromGroup: baogong-shared

  # ------------------------------------------------------------------ beat
  # Exactly one beat instance, ever. Two schedulers means two daily TCSP syncs.
  - type: worker
    name: baogong-beat
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    dockerCommand: >-
      celery -A config beat -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        fromService:
          name: baogong-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: baogong-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: baogong-keyvalue
          type: keyvalue
          property: connectionString
      - key: ALLOWED_HOSTS
        value: baogong-beat.internal
      - fromGroup: baogong-shared

  # ------------------------------------------------------------------ redis
  - type: keyvalue
    name: baogong-keyvalue
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction  # Celery broker: never drop queued tasks.
    ipAllowList: []              # Private network only.

envVarGroups:
  - name: baogong-shared
    envVars:
      - key: LOG_LEVEL
        value: INFO
      # The custom domain has to be declared to Django as well as to Render:
      # prod.py only auto-trusts RENDER_EXTERNAL_HOSTNAME, so without these two
      # every request to baogong.com.hk is a 400 and every form post a 403.
      # The .onrender.com hostname keeps working alongside them.
      # worker and beat override ALLOWED_HOSTS at service level - they have no
      # external hostname of their own.
      - key: ALLOWED_HOSTS
        value: www.baogong.com.hk,baogong.com.hk
      - key: CSRF_TRUSTED_ORIGINS
        value: https://www.baogong.com.hk,https://baogong.com.hk
      # How workers build links: a Celery task has no request to ask. Left
      # unset it falls back to http://localhost:8000 and every verification
      # and notification mail ships a dead link.
      - key: SITE_URL
        value: https://www.baogong.com.hk
      - key: AGENT_BUDGET_DAILY_USD
        value: "20"
      - key: TCSP_CSV_URL
        value: https://www.tcsp.cr.gov.hk/open-data/licensees.csv
      - key: S3_REGION
        value: apac
      # --- set these in the dashboard, they are never committed ---
      # The console prefix is a secret in its own right (prod.py rejects
      # "admin"), so it is set in the dashboard like any other.
      - key: ADMIN_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false

[project]
name = "baogong"
version = "0.1.0"
description = "BaoGong - Hong Kong TCSP licensee comparison, review and RFQ matching"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.1.*",
    "djangorestframework>=3.15",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "redis>=5.0",
    "pgvector>=0.3",
    "uuid-utils>=0.9",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "requests>=2.32",
    "boto3>=1.35",
    "django-storages>=1.14",
    "whitenoise>=6.7",
    "sentry-sdk>=2.17",
    "gunicorn>=23.0",
    "dnspython>=2.8.0",
    "markdown>=3.10.3",
    "nh3>=0.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "types-boto3>=1.35",
    "types-requests>=2.32",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "responses>=0.25",
    "django-debug-toolbar>=4.4",
    "types-markdown>=3.10.2.20260712",
]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "DJ",            # flake8-django
    "SIM",           # simplify
    "TCH",           # type-checking blocks
    "RUF",
]
ignore = [
    "RUF012",  # Django class attrs are not immutable by convention
    # This codebase is intentionally bilingual: compliance rules, banned-phrase
    # patterns and UI copy contain fullwidth CJK punctuation on purpose.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "/tests/"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
# Baseline is deliberately lenient; CLAUDE.md only mandates strict typing on the
# service layer, which is opted in via the override below.
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true

# CLAUDE.md: strict mode applies to service layer only.
[[tool.mypy.overrides]]
module = ["apps.*.services", "apps.core.money", "apps.core.compliance"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
# --ds wins over the DJANGO_SETTINGS_MODULE environment variable, which the
# compose services set to config.settings.dev. Without it, running pytest in a
# container silently tests the dev settings instead of the test settings.
addopts = "--ds=config.settings.test --strict-markers --cov=apps --cov-report=term-missing --cov-fail-under=80"
markers = [
    "eval: LLM eval runs against the real API; excluded from CI (`-m 'not eval'`)",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/apps.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

name: qs-platform

x-django: &django
  build: .
  env_file: [.env]
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DATABASE_URL: postgres://qs:qs@db:5432/qs
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
  volumes:
    - .:/app
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    minio: {condition: service_healthy}

services:
  db:
    # Official pgvector build of Postgres 16 - saves compiling the extension.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: qs
      POSTGRES_PASSWORD: qs
      POSTGRES_DB: qs
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qs -d qs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/qs-dev &&
      mc anonymous set none local/qs-dev
      "

  # One-shot migration step. web/worker/beat all wait for it to exit 0, so no
  # service can race ahead and query a table that does not exist yet - beat with
  # the DatabaseScheduler crashes on startup if django_celery_beat is unmigrated.
  migrate:
    <<: *django
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: *django
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *django
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *django
    command: ["celery", "-A", "config", "beat", "-l", "info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  redisdata:
  miniodata:
